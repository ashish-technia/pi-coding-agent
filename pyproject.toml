[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-jira-agent"
version = "0.1.0"
description = "Jira webhook to Pi agent to Bitbucket PR bridge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "langgraph>=1.0.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "langgraph-checkpoint-postgres>=3.0.0",
  "psycopg[binary,pool]>=3.2.0",
  "redis>=5.0.0",
  "langchain-core>=0.3.0",
  "langchain-anthropic>=0.3.0",
  "langchain-openai>=0.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.16.0",
  "pyright>=1.1.400",
  "pre-commit>=4.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docs", "frontend", "node", "myenv"]

[tool.ruff.lint]
# Pyflakes and the error-level pycodestyle rules, import order, bugbear and pyupgrade.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
# GraphState is a partial dict by design: a node reads keys that an earlier node wrote,
# and the graph's edges, not the type, guarantee they are present.
reportTypedDictNotRequiredAccess = false
