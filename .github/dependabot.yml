# Weekly, grouped: one pull request per ecosystem for minor and patch updates;
# major updates arrive one by one. Every pull request must pass CI before merging.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: [/, /frontend, /docs]
    schedule:
      interval: weekly
    ignore:
      # Pi is pinned exactly: a new version changes agent behaviour, so it is a planned
      # change measured on reference tickets (R-13, R-41), not a routine bump.
      - dependency-name: "@earendil-works/pi-coding-agent"
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
